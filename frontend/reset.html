<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — AI Research Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar"><div class="brand">📊 AI Research Assistant</div></header>
  <main class="app">
    <div class="card" style="max-width:440px;margin:40px auto;">
      <h1>Set a new password</h1>
      <p id="msg" class="sub">Choose a new password for your account.</p>
      <div id="form">
        <label>New password</label>
        <input id="pw" type="password" placeholder="At least 8 characters" />
        <label>Confirm password</label>
        <input id="pw2" type="password" placeholder="Repeat it" />
        <div class="btn-row">
          <button id="submit" class="btn btn-primary btn-block">Reset password</button>
        </div>
      </div>
      <p class="muted-note center"><a class="link" href="index.html">Back to sign in</a></p>
    </div>
  </main>
  <script src="config.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get("token");
    const msg = document.getElementById("msg");
    const form = document.getElementById("form");
    if (!token) { msg.textContent = "No reset token found in the link."; msg.style.color = "var(--err)"; form.style.display = "none"; }

    document.getElementById("submit").onclick = async () => {
      const pw = document.getElementById("pw").value;
      const pw2 = document.getElementById("pw2").value;
      if (pw.length < 8) { msg.textContent = "Password must be at least 8 characters."; msg.style.color = "var(--err)"; return; }
      if (pw !== pw2) { msg.textContent = "Passwords don't match."; msg.style.color = "var(--err)"; return; }
      try {
        const res = await fetch((window.API_BASE || "") + "/auth/reset-password", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, new_password: pw })
        });
        if (res.ok) {
          form.style.display = "none";
          msg.textContent = "✓ Password reset. You can now sign in with your new password.";
          msg.style.color = "var(--ok)";
        } else {
          const d = await res.json().catch(() => ({}));
          msg.textContent = d.detail || "Reset failed. The link may have expired — request a new one.";
          msg.style.color = "var(--err)";
        }
      } catch (e) { msg.textContent = "Could not reach the server. Try again later."; msg.style.color = "var(--err)"; }
    };
  </script>
</body>
</html>
