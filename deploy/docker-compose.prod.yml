# Production stack for a single Hetzner (or any) VPS.
#
#   API (FastAPI) + Postgres + Caddy (automatic HTTPS).
#
# One box runs everything. Caddy terminates TLS and reverse-proxies to the API,
# so the Vercel frontend can call the API over https. The API runs analyses in
# INLINE mode (this is a single machine) using the hardened subprocess path — the
# 4 GB box has ample memory for scipy/statsmodels/matplotlib.
#
# Start (from the repo root on the server):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# See deploy/DEPLOY-HETZNER.md for the full walkthrough.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-neura}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neura}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published ports: Postgres is only reachable inside the compose network.

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-neura}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neura}
      # Execution: single box, run inline via the hardened subprocess path.
      EXECUTION_MODE: inline
      SANDBOX_ALLOW_SUBPROCESS_FALLBACK: "true"
      # LLM (DeepSeek by default — override in deploy/.env)
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in deploy/.env}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      # Auth / app
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      FRONTEND_URL: ${FRONTEND_URL:-}
      # Payments (EasyKash) — leave blank until live
      EASYKASH_API_KEY: ${EASYKASH_API_KEY:-}
      EASYKASH_WEBHOOK_SECRET: ${EASYKASH_WEBHOOK_SECRET:-}
      # Email (SMTP) — leave blank to log links instead of sending
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - appdata:/app/data          # uploads, generated docs, sqlite (unused w/ Postgres)

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env (e.g. api.example.com or <ip>.sslip.io)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  appdata:
  caddydata:
  caddyconfig:
