<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 851 315" font-family="DejaVu Sans, sans-serif">
  <rect width="851" height="315" fill="#F6F5F2"/>

  <!-- faded node-graph motif on the right -->
  <g stroke="#C7CCF7" stroke-width="3" fill="#C7CCF7" opacity="0.9">
    <line x1="690" y1="90"  x2="770" y2="60"/>
    <line x1="690" y1="90"  x2="740" y2="160"/>
    <line x1="770" y1="60"  x2="800" y2="150"/>
    <line x1="740" y1="160" x2="800" y2="150"/>
    <line x1="740" y1="160" x2="700" y2="230"/>
    <line x1="800" y1="150" x2="790" y2="235"/>
    <circle cx="690" cy="90" r="9"/><circle cx="770" cy="60" r="9"/>
    <circle cx="740" cy="160" r="9"/><circle cx="800" cy="150" r="9"/>
    <circle cx="700" cy="230" r="9"/><circle cx="790" cy="235" r="9"/>
  </g>

  <!-- neural-N -->
  <g transform="translate(60,80)" stroke="#6366F1" stroke-width="11" stroke-linecap="round" fill="none">
    <line x1="0" y1="0" x2="0" y2="80"/>
    <line x1="60" y1="0" x2="60" y2="80"/>
    <line x1="0" y1="0" x2="60" y2="80"/>
  </g>
  <g transform="translate(60,80)" fill="#6366F1">
    <circle cx="0" cy="0" r="9"/><circle cx="0" cy="80" r="9"/><circle cx="60" cy="80" r="9"/>
    <circle cx="30" cy="40" r="8"/>
    <circle cx="60" cy="0" r="12"/><circle cx="60" cy="0" r="20" fill="none" stroke="#6366F1" stroke-width="2.5" opacity="0.5"/>
  </g>
  <text x="140" y="168" fill="#1C1A17" font-size="104" font-weight="bold" letter-spacing="-3">eura</text>

  <text x="64" y="210" fill="#57534B" font-size="20">The smart research assistant — from literature to results to write-up.</text>
</svg>
